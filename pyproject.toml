[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betting-odds-tracker"
version = "0.1.0"
description = "Real-time betting odds monitoring with line movements and cross-sportsbook comparison"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["sports-betting", "odds", "sportsbook", "shipp", "real-time"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/buildkit-ai/betting-odds-tracker"
Repository = "https://github.com/buildkit-ai/betting-odds-tracker"

[tool.hatch.build.targets.wheel]
packages = ["betting_odds_tracker"]
